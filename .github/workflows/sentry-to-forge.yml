name: Sentry → Forge ticket

# Triggered by a Sentry webhook configured to send `repository_dispatch`
# events with event_type: sentry_issue.
#
# Sentry webhook setup:
#   Settings → Integrations → Webhooks → Add Webhook
#   URL: https://api.github.com/repos/parkerscobey/hizal/dispatches
#   Headers: Authorization: token <SENTRY_GITHUB_TOKEN>
#   Payload: { "event_type": "sentry_issue", "client_payload": { ... } }
#
# Required repo secrets:
#   SENTRY_ACCESS_TOKEN  — Sentry API token (for fetching issue detail)
#   FORGE_API_TOKEN      — Forge bearer token for creating tickets

on:
  repository_dispatch:
    types: [sentry_issue]

jobs:
  create-forge-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Sentry payload
        id: sentry
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "issue_id=$(echo $PAYLOAD | jq -r '.id // empty')" >> $GITHUB_OUTPUT
          echo "issue_url=$(echo $PAYLOAD | jq -r '.url // empty')" >> $GITHUB_OUTPUT
          echo "title=$(echo $PAYLOAD | jq -r '.title // "Untitled Sentry issue"')" >> $GITHUB_OUTPUT
          echo "culprit=$(echo $PAYLOAD | jq -r '.culprit // ""')" >> $GITHUB_OUTPUT
          echo "level=$(echo $PAYLOAD | jq -r '.level // "error"')" >> $GITHUB_OUTPUT
          echo "project=$(echo $PAYLOAD | jq -r '.project // "hizal"')" >> $GITHUB_OUTPUT

      - name: Create Forge ticket
        env:
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          ISSUE_ID: ${{ steps.sentry.outputs.issue_id }}
          ISSUE_URL: ${{ steps.sentry.outputs.issue_url }}
          TITLE: ${{ steps.sentry.outputs.title }}
          CULPRIT: ${{ steps.sentry.outputs.culprit }}
          LEVEL: ${{ steps.sentry.outputs.level }}
          PROJECT: ${{ steps.sentry.outputs.project }}
        run: |
          # Map Sentry level → Forge priority
          case "$LEVEL" in
            fatal)   PRIORITY="CRITICAL" ;;
            error)   PRIORITY="HIGH" ;;
            warning) PRIORITY="MEDIUM" ;;
            *)       PRIORITY="LOW" ;;
          esac

          DESCRIPTION="**Sentry Issue:** [${ISSUE_ID}](${ISSUE_URL})\n**Project:** ${PROJECT}\n**Culprit:** ${CULPRIT}\n**Level:** ${LEVEL}\n\nAuto-created from Sentry error monitoring. Investigate and resolve."

          curl -s -X POST "https://forge.xferops.dev/api/tasks" \
            -H "Authorization: Bearer ${FORGE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"projectId\": \"cmmhg1y1f0001le01gkx2a3sk\",
              \"columnId\": \"cmmhg1y1f0002le01a4uwj2hs\",
              \"title\": \"[Sentry] ${TITLE}\",
              \"description\": \"${DESCRIPTION}\",
              \"type\": \"BUG\",
              \"priority\": \"${PRIORITY}\"
            }" | jq '.'
